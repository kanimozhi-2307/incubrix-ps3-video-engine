openapi: 3.1.0
info:
  title: IncuBrix Script and Voiceover to B-roll Engine
  version: 0.1.0
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200": {description: Service is alive}
  /ready:
    get:
      summary: Readiness check
      responses:
        "200": {description: Service readiness}
  /api/v1/broll/jobs:
    post:
      summary: Create a B-roll rendering job from audio URL, script or scenes
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                audio_url: {type: string, format: uri}
                script: {type: string}
                scenes:
                  type: array
                  items:
                    type: object
                    required: [text]
                    properties:
                      text: {type: string}
                      visual_hint: {type: string}
                voice: {type: string, default: en}
                aspect_ratios:
                  type: array
                  items: {type: string, enum: ["16:9","9:16","1:1"]}
                style: {type: string}
                avoid: {type: array, items: {type: string}}
                captions:
                  type: object
                  properties:
                    burn_in: {type: boolean}
                    srt: {type: boolean}
      responses:
        "202": {description: Job accepted}
        "400": {description: Invalid request}
        "409": {description: Idempotency key conflict}
  /api/v1/broll/jobs/upload:
    post:
      summary: Create job using uploaded audio
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                aspect_ratios: {type: string, example: "16:9,9:16"}
                voice: {type: string}
      responses:
        "202": {description: Job accepted}
  /api/v1/jobs/{job_id}:
    get:
      summary: Get job status, progress and result links
      parameters:
        - in: path
          name: job_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Job status}
        "404": {description: Job not found}
  /api/v1/files/{job_id}/{filename}:
    get:
      summary: Download a generated file
      parameters:
        - in: path
          name: job_id
          required: true
          schema: {type: string}
        - in: path
          name: filename
          required: true
          schema: {type: string}
      responses:
        "200": {description: File bytes}
